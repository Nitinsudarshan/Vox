[package]
name = "vox-native-backend"
version = "0.1.0"
description = "Vox AI Voice and Memory Assistant Rust Backend"
authors = ["Vox Team"]
license = "AGPL-3.0-only"
edition = "2021"

[lib]
name = "vox_lib"
crate-type = ["staticlib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
# `protocol-asset` serves a meeting's recording to the webview so the player
# in Meeting Detail can seek around it. Scoped at runtime to the vault's
# meetings directory and nothing else — see `lib.rs`.
tauri = { version = "2.0", features = ["tray-icon", "protocol-asset"] }
tauri-plugin-shell = "2.0"
tauri-plugin-dialog = "2.0"
tauri-plugin-notification = "2.0"
tauri-plugin-global-shortcut = "2.0"
# Opens a meeting's conferencing link in the user's default browser when
# they press Join on a reminder. `tauri-plugin-shell`'s `open` is deprecated
# in favour of this.
tauri-plugin-opener = "2"
# Writes the OS launch entry behind Settings › Startup › "Launch at login" —
# the registry Run key on Windows, a LaunchAgent on macOS, a .desktop file on
# Linux. Tauri's own plugin rather than three hand-rolled platform paths,
# because the interesting part of this feature is that the setting is finally
# read at all, not the file formats.
tauri-plugin-autostart = "2"

serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.38", features = ["full"] }
thiserror = "1.0"
tracing = "0.1"
tracing-subscriber = "0.3"
reqwest = { version = "0.12", features = ["json", "blocking"] }
cpal = "0.15"
hound = "3.5"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.8", features = ["v4", "serde"] }
whisper-rs = { version = "0.16", optional = true }
enigo = "0.2"
arboard = "3.4"
base64 = "0.22"
keyring = "2.1"
urlencoding = "2.1"
dotenvy = "0.15"
sha2 = "0.10"
pdf-extract = "0.7"
# Decodes the audio formats a meeting recording arrives in when the user
# imports one — mp3, m4a/aac, flac, ogg, wav. Pure Rust and decoded packet by
# packet, so importing a three-hour recording neither pulls in an external
# binary nor holds the whole file in memory. Meetily reaches for a bundled
# FFmpeg here, which its build downloads at compile time and `panic!`s without
# network, and then decodes whole files into RAM behind a 20 GB size guard.
symphonia = { version = "0.5", default-features = false, features = [
    "mp3",
    "aac",
    "isomp4",
    "flac",
    "ogg",
    "vorbis",
    "wav",
    "pcm",
] }
quick-xml = "0.36"
zip = { version = "2", default-features = false, features = ["deflate"] }
# Unpacks the Ollama archive on macOS and Linux (`providers::ollama_install`).
# `flate2` is already in the tree behind `zip`'s deflate, so the gzip half of a
# `.tgz` costs nothing new and this is the other half.
tar = "0.4"
flate2 = "1"

# ONNX Runtime, for `--features onnx-spike` and `--features parakeet`.
#
# Pinned exactly: 2.0 is a release candidate, and a packaging question has to
# be answered about one known version.
#
# Not in a default build. `developer::onnx_spike` has shown the runtime links
# and executes inside a real Vox binary on Linux; what is still open is whether
# `tauri build` carries the DLL into a Windows installer, which is the failure
# that looks like a working dev machine and a crash for everybody else. See
# docs/spikes/onnx-windows.md.
ort = { version = "=2.0.0-rc.13", optional = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.60", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_System_Threading",
] }

[features]
default = ["whisper-local", "parakeet"]
whisper-local = ["dep:whisper-rs"]
# Compiles the ONNX packaging spike's inference call and runs it at launch.
# See docs/spikes/onnx-windows.md. Not part of any shipped configuration.
onnx-spike = ["dep:ort"]
# Parakeet TDT transcription through ONNX Runtime — `capture::parakeet`.
#
# Off by default until the Windows bundling question above is answered: an
# engine that works for whoever built it and crashes on an installed app is
# worse than one that is absent and says so. The decoding algorithm and the
# vocabulary compile and are tested in *every* build; only the ONNX sessions
# are behind this.
parakeet = ["dep:ort"]

