name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

# A new push to the same branch supersedes an in-flight run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  repo-rules:
    name: Repository rules
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # scripts/verify-commit-rules.js enforces rules/version-and-changelog.md
      # and rules/readme.md: VERSION agrees across all manifests, CHANGELOG.md
      # exists, development tasks do not tamper with release metadata, and
      # README structure holds.
      - name: Verify repository rules and manifest consistency
        run: npm run verify:rules

      # Test the verification and release script suite.
      - name: Test the release scripts
        run: npm run test:scripts

      # The transcription harness is Python and had no failing direction in CI
      # until it had one. These tests do not need a model or a corpus: they
      # cover the audio gate that decides whether a corpus is usable, and the
      # comparative taxonomy that decides what a shootout result means.
      - name: Test the transcription harness
        run: python3 -m unittest discover -s tests/transcription/tests -v

  rust:
    name: Rust backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: native/src-tauri
    steps:
      - uses: actions/checkout@v4

      # Vox targets Windows, but the crate is platform-portable and Linux
      # runners are faster and cheaper. What Linux needs that Windows does not:
      # GTK/WebKit for Tauri, ALSA for cpal, and a C/C++ toolchain plus CMake
      # for whisper.cpp. libxdo is enigo's X11 text-injection backend.
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            libwebkit2gtk-4.1-dev \
            libjavascriptcoregtk-4.1-dev \
            libsoup-3.0-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libasound2-dev \
            libxdo-dev \
            libclang-dev \
            build-essential \
            cmake

      # No toolchain pinned here on purpose: rust-toolchain.toml is the single
      # source of truth, so a local run and this job use the same compiler and
      # therefore the same lint set. rustup installs it on the first cargo call.
      - name: Show toolchain
        run: rustc --version && cargo clippy --version

      # Includes the whisper.cpp build, which dominates a cold run.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native/src-tauri

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        run: cargo test

  # Vox ships on Windows, and everything behind `cfg(target_os = "windows")` —
  # text injection, focus tracking, the Win32 `unsafe` calls, the credential
  # store — is invisible to the Linux job above. This is the only place that
  # code is compiled, linted and tested before a user runs it.
  rust-windows:
    name: Rust backend (Windows)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: native/src-tauri
    steps:
      - uses: actions/checkout@v4

      # The runner image ships MSVC, CMake and LLVM (libclang for bindgen),
      # which is everything whisper.cpp and the Tauri crates need.
      - name: Show toolchain
        run: rustc --version && cargo clippy --version

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native/src-tauri

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      # One test at a time. Several tests reach process-wide OS state on
      # Windows (the clipboard, the foreground window, the credential store),
      # and a native crash then names the test that caused it: libtest prints
      # each test's name before running it only when it runs them serially.
      - name: Test
        run: cargo test -- --test-threads=1

  native-frontend:
    name: Native frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: native
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: native/package-lock.json

      - run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Test
        run: npm test

      # Catches what tsc alone does not: a broken import graph, a missing
      # asset, a Vite config that no longer resolves.
      - name: Build
        run: npm run build

      # The capture extension is bundled separately, from `src/webcapture`,
      # and nothing above builds it.
      - name: Build the browser extension
        run: npm run build:extension
